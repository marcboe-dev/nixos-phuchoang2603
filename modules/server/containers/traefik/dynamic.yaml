http:
  routers:
    proxmox:
      rule: Host(`proxmox.home.phuchoang.sbs`)
      entryPoints: [websecure]
      service: proxmox
      tls:
        certResolver: letsencrypt
    minio:
      rule: Host(`minio.home.phuchoang.sbs`)
      entryPoints: [websecure]
      service: minio
      tls:
        certResolver: letsencrypt
    truenas:
      rule: Host(`truenas.home.phuchoang.sbs`)
      entryPoints: [websecure]
      service: truenas
      tls:
        certResolver: letsencrypt
  services:
    proxmox:
      loadBalancer:
        servers:
          - url: https://10.69.1.1:8006
        serversTransport: insecureTransport
    minio:
      loadBalancer:
        servers:
          - url: http://10.69.1.102:30212
    truenas:
      loadBalancer:
        servers:
          - url: https://10.69.1.102
        serversTransport: insecureTransport
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true
